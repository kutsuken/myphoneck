<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的小手机</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #dcdcdc;
    font-family: Arial, sans-serif;
}

.phone {
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    padding: 30px 20px;
    background: #f7f7f7;
}

h1 {
    font-size: 22px;
    margin-bottom: 28px;
}

.apps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px 12px;
}

.app {
    text-align: center;
    cursor: pointer;
}

.icon {
    width: 60px;
    height: 60px;
    margin: auto;
    border-radius: 16px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

.name {
    margin-top: 8px;
    font-size: 12px;
}

.add {
    border: 2px dashed #aaa;
    background: transparent;
    box-shadow: none;
}

#form {
    display: none;
    margin-top: 30px;
    padding: 20px;
    background: white;
    border-radius: 18px;
}

#form h3 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="phone">

<h1>我的小手机</h1>

<div class="apps" id="apps"></div>

<div id="form">

<h3>添加网页</h3>

<input id="appName" placeholder="网页名称">

<input id="appUrl" placeholder="网址，例如 https://example.com">

<button onclick="addApp()">添加到桌面</button>

</div>

</div>

<script>

let apps = JSON.parse(
    localStorage.getItem("myApps") || "[]"
);

function render() {

    const container = document.getElementById("apps");

    container.innerHTML = "";

    apps.forEach((app, index) => {

        const div = document.createElement("div");

        div.className = "app";

        div.innerHTML = `
            <div class="icon">🌐</div>
            <div class="name">${app.name}</div>
        `;

        div.onclick = () => {
            window.open(app.url, "_blank");
        };

        container.appendChild(div);

    });

    const add = document.createElement("div");

    add.className = "app";

    add.innerHTML = `
        <div class="icon add">＋</div>
        <div class="name">添加</div>
    `;

    add.onclick = () => {

        document.getElementById("form").style.display = "block";

    };

    container.appendChild(add);
}

function addApp() {

    const name =
        document.getElementById("appName").value.trim();

    let url =
        document.getElementById("appUrl").value.trim();

    if (!name || !url) {

        alert("请填写完整");

        return;
    }

    if (!url.startsWith("http://") &&
        !url.startsWith("https://")) {

        url = "https://" + url;

    }

    apps.push({
        name: name,
        url: url
    });

    localStorage.setItem(
        "myApps",
        JSON.stringify(apps)
    );

    document.getElementById("appName").value = "";
    document.getElementById("appUrl").value = "";

    document.getElementById("form").style.display = "none";

    render();
}

render();

</script>

</body>
</html>
